name: Chrome diagnostic
on:
  push:
    branches: [main]
    paths: [.github/workflows/chrome-diagnostic.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Chrome with public failure annotations
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: |
          set -o pipefail
          npm run test:e2e -- --reporter=list,github 2>&1 | tee chrome-diagnostic.log
      - name: Save diagnostic report to an isolated branch
        if: always()
        env:
          REPORT_BRANCH: ci-diagnostics-${{ github.run_id }}
        run: |
          report_dir=$(mktemp -d)
          cp chrome-diagnostic.log "$report_dir/"
          cp -r test-results "$report_dir/"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout --orphan "$REPORT_BRANCH"
          git rm -rf --cached . >/dev/null
          cp "$report_dir/chrome-diagnostic.log" .
          cp -r "$report_dir/test-results" .
          git add -f chrome-diagnostic.log test-results
          git commit -m 'Save Chrome failure diagnostics'
          git push origin "$REPORT_BRANCH"
